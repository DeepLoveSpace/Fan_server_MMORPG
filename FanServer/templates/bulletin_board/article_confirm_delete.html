{% extends 'base.html' %}

{% block content %}
    <h1>Удалить объявление?</h1>
    <p>Вы уверены, что хотите удалить "{{ object.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Да, удалить</button>
        <a href="{% url 'article_list' %}">Отмена</a>
    </form>
{% endblock %}
